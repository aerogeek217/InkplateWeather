[project]
name = "inkplate-weather"
version = "0.1.0"
description = "Renders the Inkplate weather dashboard to an 8-gray PNG on request"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pillow>=10.4",
    "playwright>=1.47",
    "tzdata>=2024.1",  # zoneinfo data on Windows and slim images
    "astral>=3.2",  # sun and moon rise/set (pure Python, no runtime downloads)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]
basemap = [
    "pyshp>=2.3",  # tools/build_basemap.py only (the base map is committed)
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "render: needs a Playwright Chromium (skipped when none is installed)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
