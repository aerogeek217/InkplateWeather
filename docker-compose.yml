# Inkplate weather server, for the OpenMediaVault compose plugin (or plain `docker compose up -d`).
# See docs/DEPLOY.md. Before the first start:
#   cp config/config.example.yaml config/config.yaml    # then edit
#   mkdir -p cache && sudo chown 1000:1000 cache         # the container runs as uid 1000
services:
  weather-display:
    image: inkplate-weather:latest
    build:
      context: ./server
    container_name: weather-display
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config:ro   # config.yaml (+ config.example.yaml fallback); secrets come from env, not files
      - ./cache:/cache        # provider cache, last-good image, radar frames
    environment:
      INKPLATE_CONFIG: /config/config.yaml
      INKPLATE_CACHE_DIR: /cache
      TZ: America/Chicago
      # Home Assistant long-lived token (phase 2). Put HA_TOKEN=... in a .env file next to this compose file
      # (or in the OMV plugin's environment); empty when unset.
      HA_TOKEN: ${HA_TOKEN:-}
    restart: unless-stopped
    init: true          # reaps Chromium child processes
    shm_size: 256m      # Chromium uses /dev/shm; Docker's 64 MB default can crash renders
    # Chromium needs ~300-500 MB while rendering, ~150 MB idle. On a small Pi you can cap it:
    # mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
