# Inkplate weather: example configuration.
# Copy to config/config.yaml (gitignored) and edit. Secrets (tokens) come from environment variables.
#
# Durations: 30s, 10m, 2h, 1d. Each field lists its sources in priority order; the first reading
# younger than max_age wins, an older one is shown grayed out ("as of …") only if nothing fresher exists.

location: {name: "Savoy, IL", lat: 40.0617, lon: -88.2517, tz: America/Chicago}

nws:
  user_agent: "(InkplateWeather, https://github.com/aerogeek217/InkplateWeather)"
  station: KCMI

server:
  refresh_minutes: 30
  # Phase 1: /display.png renders this fixture (server/fixtures/<name>.json). Remove for live data.
  fixture: fall
  cache_dir: cache

providers:
  fixture: {type: fixture, name: fall}
  # Phase 2 (live data):
  # ecowitt: {type: ecowitt_local, host: 192.168.1.135, ttl: 0s}
  # nws_obs: {type: nws_observations, ttl: 10m}
  # nws_fc:  {type: nws_forecast, ttl: 30m}
  # nws_alerts: {type: nws_alerts, ttl: 5m}
  # om:      {type: open_meteo, ttl: 30m}
  # acis:    {type: acis, ttl: 12h}
  # astro:   {type: astro}
  # device:  {type: device}
  # ha:      {type: home_assistant, url: "http://homeassistant.local:8123", token_env: HA_TOKEN, ttl: 60s}

# Phase 1 resolves every field from the fixture provider (key defaults to the field name).
# Phase 2 example lines are shown commented underneath.
fields:
  outdoor.temperature:  [{from: fixture}]
  # outdoor.temperature: [{from: ecowitt, key: "0x02", max_age: 10m}, {from: nws_obs, max_age: 90m}]
  outdoor.humidity:     [{from: fixture}]
  outdoor.feels_like:   [{from: fixture}]
  outdoor.temperature_history: [{from: fixture}]
  wind.speed:           [{from: fixture}]
  # wind.speed:         [{from: ecowitt, key: "0x0B", max_age: 10m}, {from: nws_obs, max_age: 90m}]
  wind.gust:            [{from: fixture}]
  wind.direction:       [{from: fixture}]
  uv.index:             [{from: fixture}]
  # uv.index:           [{from: ecowitt, key: "0x17", max_age: 15m}, {from: om, key: uv_index}]
  indoor.temperature:   [{from: fixture}]
  indoor.humidity:      [{from: fixture}]
  garage.temperature:   [{from: fixture}]
  # garage.temperature: [{from: ecowitt, key: ch1.temp, max_age: 15m}]
  garage.humidity:      [{from: fixture}]
  pressure.sea_level:   [{from: fixture}]
  pressure.trend_3h:    [{from: fixture}]
  rain.today:           [{from: fixture}]
  rain.week:            [{from: fixture}]
  rain.month:           [{from: fixture}]
  rain.year:            [{from: fixture}]
  air.aqi:              [{from: fixture}]
  # air.aqi:            [{from: om, key: us_aqi}]
  # later, when the PMS5003 works (e.g. via ESPHome → Home Assistant):
  # air.aqi:            [{from: ha, entity: sensor.pms5003_aqi, max_age: 20m}, {from: om, key: us_aqi}]
  snow.depth:           [{from: fixture}]
  snow.season:          [{from: fixture}]
  normals.high:         [{from: fixture}]
  normals.low:          [{from: fixture}]
  conditions.current:   [{from: fixture}]
  forecast.hourly:      [{from: fixture}]
  forecast.daily:       [{from: fixture}]
  alerts.active:        [{from: fixture}]
  astro.sun:            [{from: fixture}]
  astro.moon:           [{from: fixture}]
  radar.frame:          [{from: fixture}]
  radar.callout:        [{from: fixture}]
  summary.day_line:     [{from: fixture}]
  summary.next_hazard:  [{from: fixture}]
